{{- $caption := $.PlainText }}
{{- if not (eq .Title "") }}
    {{- $caption = $.Title }}
{{- end }}
{{ if not (eq $caption "") }}
<figure>
    <img src="{{ .Destination }}" alt="{{ .PlainText }}">
    <figcaption>{{ $caption }}</figcaption>
</figure>
{{ else }}
<img src="{{ .Destination }}" alt="{{ .PlainText }}">
{{ end }}
